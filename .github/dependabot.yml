version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # NPM updates are enabled but we explicitly ignore the VS Code extension package
  # located in the docstring-generator-vscode directory so Dependabot won't fail
  # when it encounters the local extension artifact that is not published to npm.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "docstring-generator-vscode"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
